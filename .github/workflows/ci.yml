name: packages
on: [push, pull_request]
jobs:
  nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Evaluate every output system
        run: |
          systems=$(nix eval --raw .#packages --apply 'ps: builtins.concatStringsSep " " (builtins.attrNames ps)')
          for system in $systems; do
            nix eval --raw ".#packages.$system.default.drvPath"
            echo
          done
      - run: nix flake check --print-build-logs
      - run: nix build .#core
      - run: nix build
  racket:
    strategy:
      fail-fast: false
      matrix:
        version: ['9.3', stable]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.14
        with:
          version: ${{ matrix.version }}
          distribution: full
      - name: Prefetch sources (network phase)
        run: bash scripts/prefetch.sh /tmp/datasets-dependencies
      - name: Isolated offline installs, tests, documentation and dependency checks
        run: |
          sudo unshare --net -- env PATH="$PATH" bash "$GITHUB_WORKSPACE/scripts/install-check.sh" /tmp/datasets-dependencies/sources core
          sudo unshare --net -- env PATH="$PATH" bash "$GITHUB_WORKSPACE/scripts/install-check.sh" /tmp/datasets-dependencies/sources full
  racket-macos:
    strategy:
      fail-fast: false
      matrix:
        version: ['9.3', stable]
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.14
        with:
          version: ${{ matrix.version }}
          distribution: full
      - name: Core install and tests on the official macOS build, raco distribute included
        shell: bash
        run: |
          bash scripts/install-check.sh "$RUNNER_TEMP" core 2>&1 | tee "$RUNNER_TEMP/core.log"
          ! grep -q 'distribute.rkt: skipped' "$RUNNER_TEMP/core.log"
